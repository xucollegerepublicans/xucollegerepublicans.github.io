<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>XUCR Jeopardy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..700&family=Instrument+Serif:ital@0;1&display=swap">
<style>
/* Layout: a night-navy stage — header with medallion logo, 6×5 board, team scoreboard docked below; clues open as a full-stage card. Single deliberate dark look, built for a projector. */
:root{
  --night:#100D33;      /* stage */
  --navy:#1C1650;       /* logo X */
  --navy-2:#261F66;     /* tile face */
  --red:#BC262E;        /* logo elephant */
  --red-deep:#8E1B22;
  --gold:#BA9A62;       /* logo outline */
  --gold-hi:#E2C68E;
  --ivory:#F7F3EA;
  --ink:#ECE8F7;
  --muted:#A7A2C6;
  --line:rgba(186,154,98,.38);
  --ok:#3FA36B;
  --display:"Instrument Serif","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --sans:"Instrument Sans",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--night);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;
  background-image:radial-gradient(1200px 600px at 50% -10%,rgba(38,31,102,.9),transparent 70%),radial-gradient(800px 400px at 100% 110%,rgba(188,38,46,.14),transparent 70%);
  background-attachment:fixed;
}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--gold-hi);outline-offset:2px}
.app{
  min-height:100%;display:flex;flex-direction:column;gap:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 22px;
  max-width:1500px;margin:0 auto;
}

/* Header */
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.medal{width:64px;height:64px;border-radius:50%;background:#fff;box-shadow:0 0 0 2px var(--gold),0 0 0 6px var(--night),0 0 0 7px var(--line);flex:none;overflow:hidden;display:grid;place-items:center}
.medal img{width:100%;height:100%;object-fit:cover}
.brand{min-width:0;flex:1}
.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
h1{font-family:var(--display);font-weight:400;font-size:clamp(30px,4vw,46px);line-height:1;margin:2px 0 0;letter-spacing:-.01em;text-wrap:balance}
h1 em{color:var(--gold-hi)}
.tools{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:rgba(255,255,255,.03);padding:9px 14px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.02em;transition:background .15s,border-color .15s}
.btn:hover{background:rgba(186,154,98,.14);border-color:var(--gold)}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.primary:hover{background:#d22f38;border-color:#d22f38}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--night)}
.btn.gold:hover{background:var(--gold-hi)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

/* Board */
.board-wrap{overflow-x:auto;border-radius:14px;padding:10px;background:linear-gradient(180deg,rgba(186,154,98,.25),rgba(186,154,98,.08));}
.board{display:grid;grid-template-columns:repeat(6,minmax(128px,1fr));gap:8px;min-width:820px}
.cat{
  background:var(--navy);border-radius:8px;padding:14px 10px;min-height:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;
  border-bottom:3px solid var(--red);
}
.cat span{font-family:var(--display);font-size:clamp(18px,1.7vw,24px);line-height:1.05;text-wrap:balance;color:var(--ivory)}
.cat small{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold)}
.tile{
  position:relative;border:1px solid rgba(186,154,98,.28);background:linear-gradient(180deg,var(--navy-2),var(--navy));border-radius:8px;
  aspect-ratio:16/10;max-width:100%;display:grid;place-items:center;
  font-family:var(--display);font-size:clamp(30px,3.4vw,52px);color:var(--gold-hi);
  text-shadow:0 2px 0 rgba(0,0,0,.35);transition:transform .15s,box-shadow .15s,border-color .15s;
  font-variant-numeric:tabular-nums;
}
.tile:hover:not([disabled]){transform:translateY(-2px);border-color:var(--gold);box-shadow:0 8px 20px rgba(0,0,0,.35),inset 0 0 0 1px rgba(226,198,142,.25)}
.tile .dollar{font-size:.55em;vertical-align:.45em;margin-right:2px;opacity:.8}
.tile[disabled]{cursor:default;background:rgba(28,22,80,.35);border-color:rgba(186,154,98,.1);color:transparent;text-shadow:none}
.tile[disabled]::after{content:"★";position:absolute;font-family:var(--sans);font-size:14px;color:rgba(186,154,98,.3)}

/* Scoreboard */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.team{
  background:rgba(28,22,80,.75);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px;position:relative;transition:border-color .2s,box-shadow .2s;
}
.team.control{border-color:var(--gold-hi);box-shadow:0 0 0 1px var(--gold-hi),0 0 24px rgba(226,198,142,.18)}
.team.control::before{content:"Picks next";position:absolute;top:-9px;left:12px;background:var(--gold);color:var(--night);font-size:10px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:2px 8px;border-radius:999px}
.team input{background:transparent;border:0;border-bottom:1px dashed transparent;color:var(--ivory);font:600 14px var(--sans);letter-spacing:.04em;padding:2px 0;width:100%;min-width:0}
.team input:hover,.team input:focus{border-bottom-color:var(--line);outline:none}
.score-row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.score{font-family:var(--display);font-size:38px;line-height:1;font-variant-numeric:tabular-nums;color:var(--gold-hi)}
.score.neg{color:#ff8a8f}
.adj{display:flex;gap:4px}
.adj button{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:transparent;font-weight:700;line-height:1}
.adj button:hover{background:rgba(186,154,98,.15)}
.foot{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:12px}
kbd{font:600 11px var(--sans);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink)}

/* Overlay stage */
.stage{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(10,8,34,.86);backdrop-filter:blur(6px);
  padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow:auto}
.card{
  width:min(1100px,100%);min-height:min(640px,100%);background:radial-gradient(900px 500px at 50% 0%,#2a2270,var(--navy) 70%);
  border:1px solid var(--gold);border-radius:18px;box-shadow:0 0 0 6px var(--night),0 0 0 7px var(--line),0 30px 80px rgba(0,0,0,.5);
  display:flex;flex-direction:column;padding:clamp(20px,3vw,40px);gap:18px;animation:rise .28s ease-out both;
}
@keyframes rise{from{transform:scale(.96);opacity:.4}to{transform:none;opacity:1}}
.card-top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.card-top .cat-name{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:600}
.card-top .val{font-family:var(--display);font-size:30px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.clue{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:22px;padding-block:10px}
.clue-text{font-family:var(--display);font-size:clamp(28px,4.2vw,58px);line-height:1.12;color:var(--ivory);max-width:24ch;text-wrap:balance;margin:0}
.answer{font-family:var(--display);font-style:italic;font-size:clamp(24px,3vw,40px);color:var(--gold-hi);margin:0;text-wrap:balance}
.answer-label{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--red);font-weight:700;background:var(--ivory);padding:3px 10px;border-radius:999px}
.timer{height:6px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden}
.timer i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--red),var(--gold));transform-origin:left;transition:transform .25s linear}
.timer-row{display:flex;align-items:center;gap:12px}
.timer-row .timer{flex:1}
.timer-row b{font-variant-numeric:tabular-nums;font-weight:600;color:var(--muted);min-width:3ch;text-align:right}
.judge{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.jt{border:1px solid var(--line);border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;background:rgba(0,0,0,.18)}
.jt span{font-weight:600;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.jt .pair{display:flex;gap:6px;flex:none}
.jt button{border-radius:8px;border:1px solid var(--line);background:transparent;padding:6px 10px;font-size:13px;font-weight:700}
.jt button.right{color:#8be0ae;border-color:rgba(63,163,107,.55)}
.jt button.right:hover,.jt button.right.on{background:var(--ok);color:#fff}
.jt button.wrong{color:#ff9ca1;border-color:rgba(188,38,46,.6)}
.jt button.wrong:hover,.jt button.wrong.on{background:var(--red);color:#fff}
.actions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.dd-splash{font-family:var(--display);font-style:italic;font-size:clamp(56px,10vw,130px);line-height:.9;color:var(--gold-hi);margin:0;animation:dd .7s cubic-bezier(.2,1.4,.4,1) both;text-shadow:0 4px 0 var(--red-deep)}
@keyframes dd{from{transform:scale(.3) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
.field{display:flex;flex-direction:column;gap:6px;text-align:left}
.field label{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:600}
.field input,.field select{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ivory);font:600 18px var(--sans);min-width:0}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;align-items:flex-end}
.note{color:var(--muted);font-size:13px;margin:0}
.wagers{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;width:100%;max-width:900px}
.team-list{display:flex;flex-direction:column;gap:8px;width:100%;max-width:520px}
.team-list .tl{display:flex;gap:8px}
.team-list input{flex:1;background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:10px;padding:10px 12px;color:var(--ivory);font:600 16px var(--sans);min-width:0}
.team-list button{border:1px solid var(--line);background:transparent;border-radius:10px;padding:0 14px}
.podium{display:flex;flex-direction:column;gap:8px;width:100%;max-width:560px}
.podium div{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--line);padding:8px 2px}
.podium div:first-child{font-size:1.2em}
.podium b{font-family:var(--display);font-weight:400;font-size:28px;color:var(--gold-hi);font-variant-numeric:tabular-nums}
.big-logo{width:120px;height:120px;border-radius:50%;background:#fff;box-shadow:0 0 0 3px var(--gold),0 0 0 9px var(--navy),0 0 0 10px var(--line);overflow:hidden}
.big-logo img{width:100%;height:100%;object-fit:cover}

@media (max-width:640px){
  .medal{width:52px;height:52px}
  .tools{width:100%}
  .score{font-size:32px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style></head><body>

function renderBoard(){
  let h="";
  DATA.forEach(c=>h+=`<div class="cat"><small>Category</small><span>${esc(c.name)}</span></div>`);
  for(let r=0;r<5;r++) for(let c=0;c<6;c++){
    const k=c+"-"+r, used=S.used[k];
    h+=`<button class="tile" data-k="${k}" ${used?"disabled aria-label='Played'":`aria-label="${esc(DATA[c].name)} for ${VALUES[r]}"`}><span><span class="dollar">$</span>${VALUES[r]}</span></button>`;
  }
  $("board").innerHTML=h;
  const left=30-Object.keys(S.used).length;
  $("remaining").textContent=left?`${left} clue${left===1?"":"s"} left on the board`:"Board cleared. Time for Final Jeopardy.";
}
function renderScores(){
  $("scores").innerHTML=S.teams.map((t,i)=>`
    <div class="team ${i===S.control?"control":""}">
      <input id="tn${i}" value="${esc(t.name)}" data-i="${i}" aria-label="Team name">
      <div class="score-row">
        <div class="score ${t.score<0?"neg":""}">${fmt(t.score)}</div>
        <div class="adj"><button data-adj="${i}" data-d="-100" aria-label="Subtract 100">−</button><button data-adj="${i}" data-d="100" aria-label="Add 100">+</button></div>
      </div>
    </div>`).join("");
}
function render(){renderBoard();renderScores();save()}

$("board").addEventListener("click",e=>{const b=e.target.closest(".tile");if(b&&!b.disabled)openClue(b.dataset.k)});
$("scores").addEventListener("click",e=>{const b=e.target.closest("[data-adj]");if(!b)return;S.teams[+b.dataset.adj].score+=+b.dataset.d;render()});
$("scores").addEventListener("change",e=>{if(e.target.dataset.i!=null){S.teams[+e.target.dataset.i].name=e.target.value.trim()||"Team";save()}});

/* Timer */
let tm={left:TIME,run:false,id:null};
function timerHTML(){return `<div class="timer-row"><div class="timer"><i id="tbar"></i></div><b id="tnum">${TIME}</b><button class="btn" id="tbtn">Pause</button></div>`}
function startTimer(){
  stopTimer(); tm={left:TIME,run:true,id:null}; paint();
  tm.id=setInterval(()=>{if(!tm.run)return; tm.left=Math.max(0,tm.left-.25); paint(); if(tm.left<=0){tm.run=false;const b=$("tbtn");if(b)b.textContent="Time’s up"}},250);
  $("tbtn").onclick=toggleTimer;
}
function toggleTimer(){if(tm.left<=0)return;tm.run=!tm.run;const b=$("tbtn");if(b)b.textContent=tm.run?"Pause":"Resume"}
function stopTimer(){if(tm.id)clearInterval(tm.id);tm.run=false}
function paint(){const i=$("tbar"),n=$("tnum");if(i)i.style.transform=`scaleX(${tm.left/TIME})`;if(n)n.textContent=Math.ceil(tm.left)}

/* Stage helpers */
let cur=null;
function show(html){const s=$("stage");s.innerHTML=`<div class="card" role="dialog" aria-modal="true">${html}</div>`;s.hidden=false}
function closeStage(){stopTimer();$("stage").hidden=true;$("stage").innerHTML="";cur=null;render()}

function openClue(k){
  const [c,r]=k.split("-").map(Number);
  cur={k,c,r,value:VALUES[r],dd:S.dd.includes(k),revealed:false,results:{}};
  if(cur.dd) ddSplash(); else clueView();
}
function ddSplash(){
  const t=S.teams, ctl=S.control;
  const max=Math.max(t[ctl].score,1000);
  show(`<div class="card-top"><span class="cat-name">${esc(DATA[cur.c].name)}</span><span class="val">Wager</span></div>
  <div class="clue">
    <p class="dd-splash">Daily Double!</p>
    <div class="row">
      <div class="field"><label for="ddTeam">Team</label><select id="ddTeam">${t.map((x,i)=>`<option value="${i}" ${i===ctl?"selected":""}>${esc(x.name)}</option>`).join("")}</select></div>
      <div class="field"><label for="ddWager">Wager</label><input id="ddWager" type="number" min="5" step="100" value="${Math.min(1000,max)}" inputmode="numeric"></div>
    </div>
    <p class="note" id="ddNote">Wager up to ${fmt(max)}: your score, or $1,000 if your score is lower.</p>
    <div class="actions"><button class="btn primary" id="ddGo">Show the clue</button></div>
  </div>`);
  const upd=()=>{const i=+$("ddTeam").value;$("ddNote").textContent=`Wager up to ${fmt(Math.max(S.teams[i].score,1000))}: your score, or $1,000 if your score is lower.`};
  $("ddTeam").onchange=upd;
  $("ddGo").onclick=()=>{
    const i=+$("ddTeam").value, m=Math.max(S.teams[i].score,1000);
    let w=Math.round(+$("ddWager").value||0); w=Math.min(Math.max(w,5),m);
    cur.ddTeam=i; cur.value=w; clueView();
  };
}
function clueView(){
  const [q,a]=DATA[cur.c].clues[cur.r];
  const label=cur.dd?`Daily Double · ${esc(S.teams[cur.ddTeam].name)} · ${fmt(cur.value)}`:fmt(cur.value);
  show(`<div class="card-top"><span class="cat-name">${esc(DATA[cur.c].name)}</span><span class="val">${label}</span></div>
  ${timerHTML()}
  <div class="clue">
    <p class="clue-text">${esc(q)}</p>
    <div id="ans" hidden><div style="display:flex;flex-direction:column;align-items:center;gap:12px"><span class="answer-label">Correct response</span><p class="answer">${esc(a)}</p></div></div>
  </div>
  <div id="judgeBox"></div>
  <div class="actions"><button class="btn gold" id="reveal">Reveal answer</button><button class="btn" id="done">Back to board</button></div>`);
  $("reveal").onclick=reveal; $("done").onclick=finishClue;
  renderJudge(); startTimer();
}
function renderJudge(){
  const teams=cur.dd?[cur.ddTeam]:S.teams.map((_,i)=>i);
  $("judgeBox").innerHTML=`<div class="judge">${teams.map(i=>{const r=cur.results[i];return `<div class="jt"><span>${esc(S.teams[i].name)}</span><span class="pair"><button class="right ${r===1?"on":""}" data-j="${i}" data-v="1">✓ ${fmt(cur.value)}</button><button class="wrong ${r===-1?"on":""}" data-j="${i}" data-v="-1">✗</button></span></div>`}).join("")}</div>`;
  $("judgeBox").onclick=e=>{const b=e.target.closest("[data-j]");if(!b)return;const i=+b.dataset.j,v=+b.dataset.v;
    cur.results[i]=cur.results[i]===v?0:v; renderJudge();};
}
function reveal(){if(cur.revealed)return;cur.revealed=true;$("ans").hidden=false;stopTimer();const b=$("reveal");b.disabled=true}
function finishClue(){
  if(!cur)return;
  let winner=null;
  for(const [i,v] of Object.entries(cur.results)){ if(!v)continue; S.teams[+i].score+=v*cur.value; if(v===1)winner=+i; }
  if(winner!==null) S.control=winner;
  S.used[cur.k]=true;
  closeStage();
}

/* Final Jeopardy */
function finalStart(){
  stopTimer(); cur={final:true};
  show(`<div class="card-top"><span class="cat-name">Final Jeopardy</span><span class="val">Place your wagers</span></div>
  <div class="clue">
    <p class="eyebrow">The category is</p>
    <p class="clue-text">${esc(FINAL.cat)}</p>
    <div class="wagers">${S.teams.map((t,i)=>`<div class="field"><label for="fw${i}">${esc(t.name)} · ${fmt(t.score)}</label><input id="fw${i}" type="number" min="0" step="100" value="0" inputmode="numeric" ${t.score<=0?"disabled":""}></div>`).join("")}</div>
    <p class="note">Each team may wager from $0 up to its current score. Teams at $0 or below sit this one out. Write wagers down in secret first, then enter them.</p>
    <div class="actions"><button class="btn primary" id="fGo">Show the clue</button><button class="btn" id="fBack">Back to board</button></div>
  </div>`);
  $("fBack").onclick=closeStage;
  $("fGo").onclick=()=>{
    cur.wagers=S.teams.map((t,i)=>{let w=Math.round(+$("fw"+i).value||0);return Math.min(Math.max(w,0),Math.max(t.score,0))});
    cur.results={}; finalClue();
  };
}
function finalClue(){
  show(`<div class="card-top"><span class="cat-name">Final Jeopardy · ${esc(FINAL.cat)}</span><span class="val">Think music</span></div>
  ${timerHTML()}
  <div class="clue">
    <p class="clue-text">${esc(FINAL.clue)}</p>
    <div id="ans" hidden><div style="display:flex;flex-direction:column;align-items:center;gap:12px"><span class="answer-label">Correct response</span><p class="answer">${esc(FINAL.answer)}</p></div></div>
  </div>
  <div id="judgeBox"></div>
  <div class="actions"><button class="btn gold" id="reveal">Reveal answer</button><button class="btn primary" id="fScore">Tally final scores</button></div>`);
  cur.revealed=false;
  $("reveal").onclick=reveal;
  const rj=()=>{$("judgeBox").innerHTML=`<div class="judge">${S.teams.map((t,i)=>{const r=cur.results[i];return `<div class="jt"><span>${esc(t.name)} · wagered ${fmt(cur.wagers[i])}</span><span class="pair"><button class="right ${r===1?"on":""}" data-j="${i}" data-v="1">✓</button><button class="wrong ${r===-1?"on":""}" data-j="${i}" data-v="-1">✗</button></span></div>`}).join("")}</div>`};
  rj();
  $("judgeBox").onclick=e=>{const b=e.target.closest("[data-j]");if(!b)return;const i=+b.dataset.j,v=+b.dataset.v;cur.results[i]=cur.results[i]===v?0:v;rj()};
  $("fScore").onclick=()=>{S.teams.forEach((t,i)=>{t.score+=(cur.results[i]||0)*cur.wagers[i]});save();results()};
  startTimer();
}

      <p class="clue-text">Who’s playing tonight?</p>
      <div class="team-list">${names.map((n,i)=>`<div class="tl"><input id="ts${i}" value="${esc(n)}" aria-label="Team ${i+1} name"><button data-rm="${i}" ${names.length<=2?"disabled":""} aria-label="Remove team">✕</button></div>`).join("")}</div>
      <p class="note">2 to 6 teams. Each team picks one spokesperson to give answers. Scores are kept for teams already playing.</p>
      <div class="actions"><button class="btn" id="tsAdd" ${names.length>=6?"disabled":""}>Add a team</button><button class="btn primary" id="tsGo">${first?"Start the game":"Save teams"}</button></div>
    </div>`);
    const grab=()=>names=names.map((_,i)=>$("ts"+i).value);
    $("stage").querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{grab();names.splice(+b.dataset.rm,1);draw()});
    $("tsAdd").onclick=()=>{grab();names.push("Team "+(names.length+1));draw()};
    $("tsGo").onclick=()=>{grab();
      S.teams=names.map((n,i)=>({name:n.trim()||("Team "+(i+1)),score:S.teams[i]?S.teams[i].score:0}));
      S.control=Math.min(S.control,S.teams.length-1); S.setup=false; closeStage();};
  };
  draw();
}

/* Confirm new game in-page */
function confirmNew(){
  show(`<div class="clue"><p class="clue-text">Start a new game?</p><p class="note">Scores and the board reset. Team names stay. Daily Doubles move to new squares.</p>
  <div class="actions"><button class="btn primary" id="cYes">Reset the board</button><button class="btn" id="cNo">Keep playing</button></div></div>`);
  $("cYes").onclick=()=>{S=fresh(S.teams.map(t=>({name:t.name,score:0})));closeStage()};
  $("cNo").onclick=closeStage;
}

$("btnTeams").onclick=()=>teamSetup(false);
$("btnNew").onclick=confirmNew;
$("btnFinal").onclick=finalStart;
$("btnFull").onclick=()=>{try{if(document.fullscreenElement)document.exitFullscreen();else document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};

document.addEventListener("keydown",e=>{
  if($("stage").hidden||!cur)return;
  if(e.target.tagName==="INPUT"||e.target.tagName==="SELECT")return;
  if(e.key==="Escape"){ if(cur.final) closeStage(); else if(cur.k && $("done")) finishClue(); else closeStage(); }
  if(e.key===" "){ e.preventDefault(); if($("ans")&&!cur.revealed) reveal(); else toggleTimer(); }
});

function start(){
  S=load(); render();
  if(S.setup) teamSetup(true);
  window.claude?.hot?.snapshot?.(()=>S);
}
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
</script>
